<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REDIRECTZ</title>
</head>
<body>
    <a href="forgottoload.html">Click here if you are not redirected automatically</a>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            document.querySelector('a').style.display = 'none';
        });
        let params = new URLSearchParams(window.location.search);
        let target = params.get('user');
        if (target) {
            window.location.href = `https://github.com/${target}`;
        } else {
            window.location.href = 'forgottoload.html';
        }
    </script>
</body>
</html>
